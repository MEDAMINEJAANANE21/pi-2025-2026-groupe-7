<form class="card card-bottom" tuiCardLarge tuiSurface="floating" (submit)="onSubmit($event)">
    <h3 tuiTitle>Optimisation</h3>
    <div class="input-grid">
        <tui-textfield tuiTextfieldSize="s" class="input--vehicules">
            <label tuiLabel>Nombre de véhicules</label>
            <input tuiInputNumber [formControl]="nbVehiculesControl" [min]="1" placeholder="Nombre de véhicules" />
        </tui-textfield>
        <tui-textfield tuiTextfieldSize="s">
            <label tuiLabel>Heures</label>
            <input tuiInputNumber [formControl]="maxTimeHoursControl" [min]="0" placeholder="Heures" />
        </tui-textfield>
        <tui-textfield tuiTextfieldSize="s">
            <label tuiLabel>Minutes</label>
            <input tuiInputNumber [formControl]="maxTimeMinutesControl" [min]="0" [max]="59"  placeholder="Minutes" />
        </tui-textfield>
    </div>


    <button tuiButton appearance="accent" class="input-card-bottom" size="s" type="submit">Optimiser les trajets</button>
</form>
