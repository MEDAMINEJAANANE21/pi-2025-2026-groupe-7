# src/test/resources/application.yml
# Configuration spécifique aux tests d'intégration
# Base H2 en mémoire : rapide, isolée, sans impact sur la base de production

spring:
    main:
        banner-mode: "off"
    datasource:
        url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
        driver-class-name: org.h2.Driver
        username: sa
        password:
    jpa:
        database-platform: org.hibernate.dialect.H2Dialect
        show-sql: false
        hibernate:
            ddl-auto: create-drop                 # Crée le schéma au démarrage, le supprime à la fin
        properties:
            hibernate:
                format_sql: false
logging:
    level:
        root: WARN
        fr.uga: INFO
        sql: WARN
        org.springframework: WARN
        org.hibernate: WARN
