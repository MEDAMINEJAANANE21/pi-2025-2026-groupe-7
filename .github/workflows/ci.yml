name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · tests et couverture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify lance les tests (H2 en mémoire, OpenRouteService simulé) puis le contrôle JaCoCo.
      - name: Tests et seuil de couverture
        run: mvn -B --no-transfer-progress -f backend/pom.xml verify

      - name: Rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture-backend
          path: backend/server/target/site/jacoco/
          retention-days: 7

  frontend:
    name: Frontend · build et tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run test:ci

  docker:
    name: Image Docker de production
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: cybercommandes:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
