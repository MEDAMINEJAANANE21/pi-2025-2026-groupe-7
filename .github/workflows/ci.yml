name: CI - Test Frontend & Backend

on:
    # push:
    #     branches: [ main ]
    # pull_request:
    #     branches: [ main ]
    workflow_dispatch:


jobs:
  test-frontend:
    name: Test Frontend (Angular)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: client/package-lock.json

    - name: Install dependencies
      working-directory: ./client
      run: npm ci

    - name: Create ORS API key file
      working-directory: ./client
      run: echo "export const orsKey = '';" > src/app/services/orsKey.ts

    - name: Run linter
      working-directory: ./client
      run: npm run ng lint || echo "Linting skipped - not configured"
      continue-on-error: true

    - name: Build Angular app
      working-directory: ./client
      run: npm run build

    - name: Run tests
      working-directory: ./client
      run: npm test -- --watch=false --browsers=ChromeHeadless

  test-backend:
    name: Test Backend (Spring Boot)
    runs-on: ubuntu-latest

    env:
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_URL: ${{ secrets.DB_URL }}
      DB_JPA_DDL_AUTO: validate

    strategy:
      matrix:
        java-version: [21]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java-version }}
        cache: 'maven'

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Build with Maven
      working-directory: ./backend
      run: mvn clean compile -B

    - name: Run tests
      working-directory: ./backend
      run: mvn test -B

    - name: Package application
      working-directory: ./backend
      run: mvn package -DskipTests -B

  build-docker:
    name: Build Production Docker Image
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend]
    if: github.ref == 'refs/heads/main'

    env:
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_URL: ${{ secrets.DB_URL }}
      DB_JPA_DDL_AUTO: validate

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: projet-integrateur:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker image
      run: |
        docker build -t projet-integrateur:test .
        docker run -d -p 8080:8080 --name test-container \
          -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
          -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
          -e DB_URL=${{ secrets.DB_URL }} \
          -e DB_JPA_DDL_AUTO=validate \
          projet-integrateur:test
        sleep 10
        curl -sf http://localhost:8080 || (docker logs test-container; exit 0)
        docker stop test-container
        docker rm test-container
