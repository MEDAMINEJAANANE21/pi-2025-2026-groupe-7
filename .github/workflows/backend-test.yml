name: Backend Tests Only

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-test.yml'
#   pull_request:
#     paths:
#       - 'backend/**'

jobs:
  test:
    name: Test Spring Boot Application
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'maven'

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Build application (Test if compiles)
      working-directory: ./backend
      run: mvn package -DskipTests -B --no-transfer-progress

    - name: Run tests with Maven
      working-directory: ./backend
      run: mvn clean org.jacoco:jacoco-maven-plugin:prepare-agent test -B --no-transfer-progress

    - name: Generate coverage report and run checks
      continue-on-error: true
      working-directory: ./backend
      run: mvn org.jacoco:jacoco-maven-plugin:report org.jacoco:jacoco-maven-plugin:check -B --no-transfer-progress

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install CSV table utility
      run: |
        sudo apt-get update
        sudo apt-get install -y miller

    - name: Show coverage CSV in terminal
      working-directory: ./backend
      run: mlr --icsv --opprint cat server/target/site/jacoco/jacoco.csv

    - name: Show global coverage from Python script
      working-directory: ./backend
      run: python jacoco_total_coverage.py

    - name: Upload coverage artifacts
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-coverage-report
        path: backend/server/target/site/jacoco/
        retention-days: 1

